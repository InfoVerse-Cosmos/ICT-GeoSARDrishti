[pytest]
# Surface our own deprecations, but silence one we cannot act on: Starlette's
# TestClient warns that pairing it with httpx is deprecated in favour of "httpx2"
# (StarletteDeprecationWarning, a UserWarning). It originates inside
# fastapi/starlette, not our code, so we filter just that message.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
